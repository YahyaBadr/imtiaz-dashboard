<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2B1A2B">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/college_logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>لوحة متابعة الإمتياز البيطري</title>
  <link rel="stylesheet" href="style.css?v=99">
  <link rel="stylesheet" href="print.css">
  <script src="config.js?v=99"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-top-row">
        <div class="logo-wrapper"><img src="assets/university_logo.png" alt="الجامعة" class="header-logo" onerror="this.style.display='none'"></div>
        <div class="header-title-box">
          <h1>لوحة متابعة الإمتياز البيطري</h1>
          <p class="header-subtitle">مكتب السيد الأستاذ الدكتور / وكيل الكلية</p>
          <div class="header-meta-badge" id="header-last-update">آخر تحديث: 3 نوفمبر 2026</div>
        </div>
        <div class="header-actions">
          <button class="header-btn" onclick="installApp()" style="background:var(--c-gold); color:var(--c-plum); font-weight:bold;">
            <span>📲 تثبيت التطبيق</span>
          </button>
          <button class="header-btn" onclick="openGlobalSearch()"><span>🔍 بحث</span></button>
          <button class="header-btn" onclick="window.print()"><span>🖨️ طباعة</span></button>
        </div>
        <div class="logo-wrapper"><img src="assets/college_logo.png" alt="الكلية" class="header-logo" onerror="this.style.display='none'"></div>
      </div>
    </div>
  </header>

  <nav class="site-nav">
    <div class="nav-inner">
      <button class="nav-btn active" data-page="overview"><span>📊</span><span>الملخص</span></button>
      <button class="nav-btn" data-page="schedule"><span>📅</span><span>المصفوفة</span></button>
      <button class="nav-btn" data-page="units"><span>🏥</span><span>الوحدات</span></button>
      <button class="nav-btn" data-page="not-registered"><span>⚠️</span><span>غير المسجلين</span></button>
    </div>
  </nav>

  <main id="main-content" class="main-content">
    <div id="loading-screen" class="loading-screen"><div class="loading-spinner"></div><p>جاري التحميل…</p></div>
    <div id="page-overview" class="page hidden"></div>
    <div id="page-schedule" class="page hidden"></div>
    <div id="page-units" class="page hidden"></div>
    <div id="page-not-registered" class="page hidden"></div>
  </main>

  <div id="verify-badge" class="verify-badge hidden"></div>

  <!-- Notice the ?v=99 at the end of each file -->
  <script src="lib/papaparse.min.js"></script>
  <script src="app.js?v=99"></script>
  <script src="pages/overview.js?v=99"></script>
  <script src="pages/schedule.js?v=99"></script>
  <script src="pages/units.js?v=99"></script>
  <script src="pages/not-registered.js?v=99"></script>
  
  <script>
    window.installApp = function() {
      alert("لتثبيت التطبيق على جهازك:\n\n📱 للآيفون (iOS):\nاضغط على زر 'مشاركة' (Share) في أسفل الشاشة، ثم اختر 'إضافة إلى الشاشة الرئيسية' (Add to Home Screen).\n\n🤖 للأندرويد (Android):\nاضغط على الثلاث نقاط (⋮) في أعلى المتشفير، ثم اختر 'تثبيت التطبيق' (Install App).");
    };
  </script>
</body>
</html>
